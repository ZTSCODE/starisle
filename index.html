<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>星屿物语</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%237EC850'/><rect x='4' y='4' width='8' height='8' fill='%23FFD98A'/></svg>" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a12;
      user-select: none; -webkit-user-select: none; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; image-rendering: pixelated; }
    #ui { position: fixed; inset: 0; pointer-events: none; font-family: "Microsoft YaHei", "PingFang SC", monospace; }
    #ui > * { pointer-events: auto; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; background: #0a0a12; color: #cfd8ff; z-index: 9999;
      font-family: "Microsoft YaHei", "PingFang SC", monospace; transition: opacity .6s; }
    #loading .title { font-size: 42px; letter-spacing: 12px; color: #ffd98a; text-shadow: 0 0 24px #ff9d4d; }
    #loading .bar { width: 320px; height: 10px; border: 2px solid #4a5578; margin-top: 24px; }
    #loading .bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd98a, #ff9d4d); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <div id="loading">
    <div class="title">星屿物语</div>
    <div class="bar"><div id="loadbar"></div></div>
    <div id="loadtext" style="margin-top:12px;font-size:13px;opacity:.7">正在生成世界…</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
